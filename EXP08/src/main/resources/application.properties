spring.application.name=experiment_7_springboot2

 # H2 Database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

 # JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

 # H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

 # Stripe key from environment (empty allowed so app can start without payment setup)
stripe.secret.key=${STRIPE_SECRET_KEY:}

 # Mail config from environment variables
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

 # Fixed Basic Auth credentials for API testing